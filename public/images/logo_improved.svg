<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 400" width="1150" height="400">

  <!-- ===== R/EAR SYMBOL - First letter shaped like an ear with sound waves ===== -->
  <g transform="translate(52, 8)">
    
    <!-- R vertical stroke (left side) -->
    <line x1="0" y1="260" x2="0" y2="25" 
          stroke="#2e4230" stroke-width="13" stroke-linecap="round"/>
    
    <!-- R bowl as ear helix - outer curve forming ear shape -->
    <path d="M 0 25 C 0 5 24 0 48 0 L 102 0 C 148 0 172 36 172 80 C 172 116 148 145 114 154" 
          fill="none" stroke="#2e4230" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- R leg (diagonal) -->
    <line x1="100" y1="130" x2="168" y2="260" 
          stroke="#2e4230" stroke-width="13" stroke-linecap="round"/>
    
    <!-- Inner ear detail - inner helix suggesting ear canal -->
    <path d="M 32 42 C 24 26 40 16 62 16 L 88 16 C 116 16 130 42 130 76 C 130 108 110 128 84 128 L 32 128" 
          fill="none" stroke="#2e4230" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Ear canal sage accent -->
    <path d="M 48 52 C 58 38 78 36 90 48" 
          fill="none" stroke="#A8C3A0" stroke-width="5.5" stroke-linecap="round"/>
    
    <!-- Small lobe accent -->
    <path d="M 4 186 C 12 204 14 230 10 250" 
          fill="none" stroke="#A8C3A0" stroke-width="4" stroke-linecap="round" opacity="0.6"/>

    <!-- Sound wave 1 - closest -->
    <path d="M 188 14 C 214 52 214 222 188 264" 
          fill="none" stroke="#2e4230" stroke-width="7.5" stroke-linecap="round"/>
    
    <!-- Sound wave 2 -->
    <path d="M 220 0 C 252 42 252 236 220 282" 
          fill="none" stroke="#2e4230" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Sound wave 3 - farthest -->
    <path d="M 250 0 C 286 40 286 274 250 318" 
          fill="none" stroke="#2e4230" stroke-width="4.2" stroke-linecap="round"/>
    
    <!-- Sage inner glow on waves -->
    <path d="M 188 80 C 202 106 202 192 188 214" 
          fill="none" stroke="#A8C3A0" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
    <path d="M 220 60 C 236 90 236 200 220 230" 
          fill="none" stroke="#A8C3A0" stroke-width="2.5" stroke-linecap="round" opacity="0.3"/>
  </g>

  <!-- ===== E letter ===== -->
  <g transform="translate(355, 8)">
    <line x1="0" y1="0" x2="0" y2="260" 
          stroke="#2e4230" stroke-width="13" stroke-linecap="round"/>
    <line x1="0" y1="6" x2="162" y2="6" 
          stroke="#2e4230" stroke-width="13" stroke-linecap="round"/>
    <line x1="0" y1="130" x2="132" y2="130" 
          stroke="#2e4230" stroke-width="9.5" stroke-linecap="round"/>
    <line x1="0" y1="254" x2="162" y2="254" 
          stroke="#2e4230" stroke-width="13" stroke-linecap="round"/>
  </g>

  <!-- ===== P letter ===== -->
  <g transform="translate(575, 8)">
    <line x1="0" y1="0" x2="0" y2="260" 
          stroke="#2e4230" stroke-width="13" stroke-linecap="round"/>
    <path d="M 0 6 C 0 0 6 0 18 0 L 90 0 C 136 0 158 32 158 75 C 158 112 136 145 90 145 L 0 145" 
          fill="none" stroke="#2e4230" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ===== Subtitle: Red de Escucha Psicológica ===== -->
  <text x="52" y="318" 
        font-family="'Liberation Sans', 'Carlito', 'DejaVu Sans', Arial, Helvetica, sans-serif" 
        font-size="36" 
        font-weight="300"
        fill="#2e4230" 
        letter-spacing="3">Red de Escucha Psicológica</text>
  
  <!-- Subtle decorative line under subtitle -->
  <line x1="52" y1="334" x2="710" y2="334" 
        stroke="#A8C3A0" stroke-width="1.5" stroke-linecap="round" opacity="0.35"/>
</svg>
