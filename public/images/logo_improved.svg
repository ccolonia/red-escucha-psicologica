<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340">

  <!-- ===== R/EAR SYMBOL - First letter of REP shaped like an ear ===== -->
  <g transform="translate(0, 20)">
    
    <!-- R vertical stroke (left side of ear) -->
    <line x1="38" y1="280" x2="38" y2="30" 
          stroke="#2e4230" stroke-width="11" stroke-linecap="round"/>
    
    <!-- R bowl shaped as ear helix - the outer curve forms both R bowl and ear shape -->
    <path d="M 38 30 C 38 10 56 0 78 0 L 125 0 C 164 0 182 28 182 65 C 182 96 164 122 140 130" 
          fill="none" stroke="#2e4230" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- R leg (diagonal stroke going down-right) -->
    <line x1="126" y1="112" x2="180" y2="280" 
          stroke="#2e4230" stroke-width="11" stroke-linecap="round"/>
    
    <!-- Inner ear - inner helix curve suggesting ear canal -->
    <path d="M 64 48 C 58 34 72 24 90 24 L 110 24 C 132 24 142 46 142 70 C 142 94 126 110 106 110 L 64 110" 
          fill="none" stroke="#2e4230" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Ear canal accent in sage green -->
    <path d="M 78 56 C 86 46 100 44 110 52" 
          fill="none" stroke="#A8C3A0" stroke-width="4.5" stroke-linecap="round"/>
    
    <!-- Small ear lobe accent -->
    <path d="M 42 205 C 50 220 52 245 48 270" 
          fill="none" stroke="#A8C3A0" stroke-width="3.5" stroke-linecap="round" opacity="0.6"/>

    <!-- Sound wave 1 - closest, thickest -->
    <path d="M 196 18 C 218 50 218 250 196 285" 
          fill="none" stroke="#2e4230" stroke-width="6.5" stroke-linecap="round"/>
    
    <!-- Sound wave 2 -->
    <path d="M 222 0 C 250 40 250 260 222 305" 
          fill="none" stroke="#2e4230" stroke-width="5" stroke-linecap="round"/>
    
    <!-- Sound wave 3 - farthest, thinnest -->
    <path d="M 248 0 C 280 40 280 290 248 335" 
          fill="none" stroke="#2e4230" stroke-width="3.8" stroke-linecap="round"/>
    
    <!-- Subtle sage green inner glow on waves -->
    <path d="M 196 82 C 208 104 208 220 196 238" 
          fill="none" stroke="#A8C3A0" stroke-width="2.8" stroke-linecap="round" opacity="0.4"/>
    <path d="M 222 62 C 236 90 236 228 222 256" 
          fill="none" stroke="#A8C3A0" stroke-width="2.2" stroke-linecap="round" opacity="0.3"/>
  </g>

  <!-- ===== E letter ===== -->
  <g transform="translate(290, 20)">
    <line x1="34" y1="0" x2="34" y2="280" 
          stroke="#2e4230" stroke-width="11" stroke-linecap="round"/>
    <line x1="34" y1="6" x2="152" y2="6" 
          stroke="#2e4230" stroke-width="11" stroke-linecap="round"/>
    <line x1="34" y1="140" x2="124" y2="140" 
          stroke="#2e4230" stroke-width="8.5" stroke-linecap="round"/>
    <line x1="34" y1="274" x2="152" y2="274" 
          stroke="#2e4230" stroke-width="11" stroke-linecap="round"/>
  </g>

  <!-- ===== P letter ===== -->
  <g transform="translate(478, 20)">
    <line x1="34" y1="0" x2="34" y2="280" 
          stroke="#2e4230" stroke-width="11" stroke-linecap="round"/>
    <path d="M 34 6 C 34 0 40 0 50 0 L 105 0 C 142 0 158 28 158 68 C 158 102 142 132 105 132 L 34 132" 
          fill="none" stroke="#2e4230" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ===== Vertical separator line ===== -->
  <line x1="660" y1="60" x2="660" y2="260" 
        stroke="#A8C3A0" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

  <!-- ===== Subtitle text to the RIGHT of REP ===== -->
  <!-- "Red de Escucha" in sage green -->
  <text x="685" y="135" 
        font-family="'Liberation Sans', 'Carlito', 'DejaVu Sans', Arial, Helvetica, sans-serif" 
        font-size="52" 
        font-weight="300"
        fill="#A8C3A0" 
        letter-spacing="3">Red de Escucha</text>
  
  <!-- "Psicológica" in forest green -->
  <text x="685" y="200" 
        font-family="'Liberation Sans', 'Carlito', 'DejaVu Sans', Arial, Helvetica, sans-serif" 
        font-size="52" 
        font-weight="400"
        fill="#2e4230" 
        letter-spacing="3">Psicológica</text>
</svg>
